<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGNC — Control de Calidad</title>
  <script src="https://cdn.tailwindcss.com"></script>

<body class="min-h-screen flex flex-col">

  <!-- Overlay de carga inicial -->
  <div id="loadingOverlay" class="hidden fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="flex flex-col items-center gap-3">
      <div class="spinner spinner-dark w-8 h-8"></div>
      <p class="text-sm font-medium text-slate-600">Cargando entorno SIGNC...</p>
    </div>
  </div>

  <!-- Vista de Login Propio -->
  <main id="loginView" class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 p-6 md:p-8">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-600 text-white font-bold text-xl mb-3">S</div>
        <h1 class="text-2xl font-bold text-slate-900">SIGNC</h1>
        <p class="text-sm text-slate-500">Sistema Integral de Gestión de Calidad</p>
      </div>

      <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label for="loginUsuario" class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
          <input id="loginUsuario" type="text" required autocomplete="username" placeholder="ej. coord.prod"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" />
        </div>
        <div>
          <label for="loginPassword" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
          <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="••••••••"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" />
        </div>

        <div id="loginError" class="hidden text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-xl p-3"></div>

        <button id="loginBtn" type="submit"
          class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition flex items-center justify-center">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </main>

  <!-- Shell Principal Responsivo (PC / Tablet / Celular) -->
  <div id="appShell" class="hidden min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-blue-600 text-white font-bold flex items-center justify-center">S</div>
        <div>
          <span class="font-bold text-slate-900 block leading-tight">SIGNC</span>
          <span id="headerEmpresa" class="text-xs text-slate-500 block"></span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
          <span id="headerUserName" class="text-sm font-medium text-slate-800 block leading-tight"></span>
          <span id="headerUserRol" class="text-xs font-semibold text-blue-600 uppercase"></span>
        </div>
        <button onclick="handleLogout()" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-medium text-slate-700 hover:bg-slate-100">
          Salir
        </button>
      </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row">
      <!-- Navegación Desktop / Tablet -->
      <aside class="hidden md:flex md:w-60 bg-white border-r border-slate-200 p-4 flex-col gap-1.5">
        <button data-nav="dashboard" onclick="navigateTo('dashboard')" class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm font-medium transition">Panel Principal</button>
        <button data-nav="snc" onclick="navigateTo('snc')" class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm font-medium transition">No Conformidades</button>
        <button data-nav="auditorias" onclick="navigateTo('auditorias')" class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm font-medium transition">Auditorías 5S</button>
        <button data-nav="futuros" onclick="navigateTo('futuros')" class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm font-medium transition">Módulos Futuros</button>
      </aside>

      <!-- Área Principal -->
      <section id="mainContent" class="flex-1 p-4 md:p-6 pb-24 md:pb-6 max-w-6xl w-full mx-auto"></section>
    </div>

    <!-- Navegación Inferior Móvil -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 grid grid-cols-4 gap-1 p-1.5 z-30">
      <button data-nav="dashboard" onclick="navigateTo('dashboard')" class="py-2 rounded-lg text-xs font-medium text-center">Inicio</button>
      <button data-nav="snc" onclick="navigateTo('snc')" class="py-2 rounded-lg text-xs font-medium text-center">SNC</button>
      <button data-nav="auditorias" onclick="navigateTo('auditorias')" class="py-2 rounded-lg text-xs font-medium text-center">5S</button>
      <button data-nav="futuros" onclick="navigateTo('futuros')" class="py-2 rounded-lg text-xs font-medium text-center">Olas</button>
    </nav>
  </div>

  <div id="toastBox" class="hidden"></div>
