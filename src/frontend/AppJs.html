<script>
  const TOKEN_KEY = 'signc_session_token';

  const AppState = {
    token: sessionStorage.getItem(TOKEN_KEY) || null,
    user: null,
    empresa: null,
    areas: [],
    procesos: [],
    catalogos: [],
    usuarios: [],
    currentView: 'dashboard'
  };

  const ApiClient = {
    call(fnName, ...args) {
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          reject(new Error('Entorno Google Apps Script no disponible.'));
          return;
        }
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.ok) {
              resolve(res.data);
            } else {
              const msg = (res && res.error) ? res.error : 'Error inesperado en el servidor.';
              if (msg.toLowerCase().includes('sesión') && msg.toLowerCase().includes('expirado')) {
                handleForceLogout();
              }
              reject(new Error(msg));
            }
          })
          .withFailureHandler((err) => {
            reject(new Error(err && err.message ? err.message : 'Error de comunicación con el servidor.'));
          })[fnName](...args);
      });
    }
  };

  function showToast(message, type = 'info') {
    const el = document.getElementById('toastBox');
    const colors = {
      info: 'bg-slate-900 text-white border border-slate-700',
      success: 'bg-emerald-600 text-white',
      error: 'bg-rose-600 text-white'
    };
    el.className = `fixed bottom-20 md:bottom-6 right-4 left-4 md:left-auto md:w-96 px-4 py-3 rounded-xl shadow-xl text-sm font-medium z-50 ${colors[type] || colors.info}`;
    el.textContent = message;
    el.classList.remove('hidden');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => el.classList.add('hidden'), 4000);
  }

  function closeModal() {
    document.getElementById('modalRoot').classList.add('hidden');
  }

  async function handleLoginSubmit(event) {
    event.preventDefault();
    const usuario = document.getElementById('loginUsuario').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('loginError');

    errBox.classList.add('hidden');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner mr-2"></span> Verificando...';

    try {
      const res = await ApiClient.call('apiLogin', usuario, password);
      AppState.token = res.token;
      sessionStorage.setItem(TOKEN_KEY, res.token);
      await loadBootstrap();
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Ingresar al Sistema';
    }
  }

  async function loadBootstrap() {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('loadingOverlay').classList.remove('hidden');
    try {
      const data = await ApiClient.call('apiGetBootstrap', AppState.token);
      AppState.user = data.user;
      AppState.empresa = data.empresa;
      AppState.areas = data.areas;
      AppState.procesos = data.procesos;
      AppState.catalogos = data.catalogos;
      AppState.usuarios = data.usuarios;

      renderShellHeader();
      document.getElementById('appShell').classList.remove('hidden');
      navigateTo('dashboard');
    } catch (err) {
      handleForceLogout();
      showToast(err.message, 'error');
    } finally {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }
  }

  async function handleLogout() {
    const token = AppState.token;
    handleForceLogout();
    if (token) {
      try { await ApiClient.call('apiLogout', token); } catch (_) {}
    }
  }

  function handleForceLogout() {
    AppState.token = null;
    AppState.user = null;
    sessionStorage.removeItem(TOKEN_KEY);
    document.getElementById('appShell').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('loginPassword').value = '';
  }

  function renderShellHeader() {
    const u = AppState.user;
    const empName = AppState.empresa ? AppState.empresa.nombre : '';
    document.getElementById('sidebarEmpresa').textContent = empName;
    document.getElementById('sidebarUserName').textContent = u.nombre;
    document.getElementById('sidebarUserRol').textContent = u.rol;
    document.getElementById('mobileEmpresa').textContent = empName;
    document.getElementById('mobileUserRol').textContent = u.rol;
  }

  function navigateTo(view) {
    AppState.currentView = view;
    document.querySelectorAll('.nav-btn').forEach((btn) => {
      const active = btn.getAttribute('data-nav') === view;
      btn.className = `nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition ${
        active ? 'bg-slate-800 text-amber-400 border-l-4 border-amber-500' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'
      }`;
    });
    document.querySelectorAll('.nav-btn-mobile').forEach((btn) => {
      const active = btn.getAttribute('data-nav') === view;
      btn.className = `nav-btn-mobile py-2 rounded-lg text-[11px] font-semibold text-center ${
        active ? 'bg-slate-800 text-amber-400' : 'text-slate-400'
      }`;
    });

    const container = document.getElementById('mainContent');
    if (view === 'dashboard') {
      renderDashboard(container);
    } else if (view === 'snc') {
      SncUI.loadAndRender(container);
    } else if (view === 'auditorias') {
      container.innerHTML = renderModulePlaceholder('Módulo 2 — Auditorías 5S e ISO', 'Listo para construir en el Paso 6 (Checklist móvil 5S, puntaje automático y generación directa de SNC).');
    } else if (view === 'futuros') {
      container.innerHTML = renderFutureRoadmap();
    }
  }

  async function renderDashboard(container) {
    container.innerHTML = '<div class="bg-white rounded-2xl p-8 border border-slate-200 text-center text-sm text-slate-500">Cargando tablero de calidad...</div>';
    try {
      const sncData = await ApiClient.call('apiGetSncDashboard', AppState.token);
      SncUI.data = sncData;
      const c = sncData.counts;
      const rol = AppState.user.rol;

      const cardsByRol = {
        GERENCIA: [
          { title: 'Por Asignar', count: c.porAsignar, accent: 'border-l-amber-500', filtro: 'PENDIENTE' },
          { title: 'Por Revisar (Cierre)', count: c.porRevisar, accent: 'border-l-sky-500', filtro: 'ACTIVA' },
          { title: 'Activas en Planta', count: c.activas, accent: 'border-l-emerald-500', filtro: 'ACTIVA' },
          { title: 'Pausadas', count: c.pausadas, accent: 'border-l-purple-500', filtro: 'PAUSADA' }
        ],
        COORDINADOR: [
          { title: 'Por Aceptar', count: c.porAceptar, accent: 'border-l-amber-500', filtro: 'PENDIENTE' },
          { title: 'Por Asignar', count: c.porAsignar, accent: 'border-l-sky-500', filtro: 'PENDIENTE' },
          { title: 'Activas de mi Área', count: c.activas, accent: 'border-l-emerald-500', filtro: 'ACTIVA' },
          { title: 'Mis Solicitadas', count: c.misSolicitadas, accent: 'border-l-slate-500', filtro: 'TODOS' }
        ],
        DEFAULT: [
          { title: 'Por Aceptar', count: c.porAceptar, accent: 'border-l-amber-500', filtro: 'PENDIENTE' },
          { title: 'Mis Activas', count: c.activas, accent: 'border-l-emerald-500', filtro: 'ACTIVA' },
          { title: 'Pausadas', count: c.pausadas, accent: 'border-l-purple-500', filtro: 'PAUSADA' },
          { title: 'Mis Solicitadas', count: c.misSolicitadas, accent: 'border-l-slate-500', filtro: 'TODOS' }
        ]
      };
      const cards = cardsByRol[rol] || cardsByRol.DEFAULT;

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
          <div>
            <h2 class="text-xl md:text-2xl font-extrabold text-slate-900 tracking-tight">Hola, ${AppState.user.nombre}</h2>
            <p class="text-xs text-slate-500">Panel operativo · <strong>${AppState.empresa.nombre}</strong> · Rol: <span class="font-semibold text-amber-700">${rol}</span></p>
          </div>
          <button onclick="navigateTo('snc'); setTimeout(() => SncUI.openCreateModal(), 250);"
            class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl text-sm shadow-sm transition">
            + Reportar NC / Mejora
          </button>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
          ${cards.map(card => `
            <div onclick="SncUI.filter.estado='${card.filtro}'; navigateTo('snc');"
              class="bg-white rounded-2xl p-4 border border-slate-200 border-l-4 ${card.accent} shadow-xs hover:shadow-md transition cursor-pointer">
              <p class="text-[11px] font-bold uppercase tracking-wider text-slate-500">${card.title}</p>
              <p class="text-3xl font-extrabold font-mono-code text-slate-900 mt-2">${card.count}</p>
            </div>
          `).join('')}
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-slate-900 text-sm">Expedientes Recientes</h3>
            <button onclick="navigateTo('snc')" class="text-xs font-bold text-amber-600 hover:text-amber-700">Ver todos →</button>
          </div>
          ${sncData.hallazgos.length === 0 ? `
            <p class="text-sm text-slate-500 py-4">Aún no hay Salidas No Conformes registradas. Usa el botón <strong>+ Reportar NC / Mejora</strong> para crear la primera.</p>
          ` : `
            <div class="divide-y divide-slate-100">
              ${sncData.hallazgos.slice(0, 5).map(h => `
                <div onclick="navigateTo('snc'); SncUI.openDetail('${h.id}');" class="py-3 flex items-center justify-between gap-3 hover:bg-slate-50 px-2 rounded-xl cursor-pointer">
                  <div class="min-w-0">
                    <p class="text-sm font-semibold text-slate-800 truncate"><span class="font-mono-code text-xs text-slate-500 mr-2">${h.consecutivo}</span>${h.resumen_solicitud}</p>
                    <p class="text-xs text-slate-400">${SncUI.getAreaName(h.area_asignada_id)} · ${h.fase_actual}</p>
                  </div>
                  ${SncUI.badgeEstado(h.estado_actual)}
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function renderModulePlaceholder(title, desc) {
    return `
      <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs">
        <h2 class="text-xl font-bold text-slate-900 mb-2">${title}</h2>
        <p class="text-sm text-slate-600">${desc}</p>
      </div>
    `;
  }

  function renderFutureRoadmap() {
    return `
      <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-4">
        <h2 class="text-xl font-extrabold text-slate-900">Módulos Escalables (Olas 1–3)</h2>
        <div class="grid md:grid-cols-3 gap-4 text-sm">
          <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
            <h3 class="font-bold text-amber-700 mb-2">Ola 1 — Corto Plazo</h3>
            <ul class="list-disc pl-4 space-y-1 text-slate-600">
              <li>Metrología y Calibración</li>
              <li>Recepción MP y Proveedores</li>
              <li>PQRS / Reclamos de Clientes</li>
            </ul>
          </div>
          <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
            <h3 class="font-bold text-sky-700 mb-2">Ola 2 — Mediano Plazo</h3>
            <ul class="list-disc pl-4 space-y-1 text-slate-600">
              <li>Indicadores y Costos (COPQ)</li>
              <li>Control Documental e Instructivos</li>
              <li>Inspección en Proceso y PT</li>
            </ul>
          </div>
          <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
            <h3 class="font-bold text-slate-700 mb-2">Ola 3 — Largo Plazo</h3>
            <ul class="list-disc pl-4 space-y-1 text-slate-600">
              <li>Competencias y Calificación</li>
              <li>Mantenimiento Preventivo (Calidad)</li>
            </ul>
          </div>
        </div>
      </div>
    `;
  }

  window.addEventListener('DOMContentLoaded', () => {
    if (AppState.token) {
      loadBootstrap();
    }
  });
</script>
